<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Hearshot OCR spike</title></head><body><pre id="log">OCR spike page</pre>
<script type="module">
const w = new Worker(new URL('./ocr-worker.js', import.meta.url), { type: 'module' });
let pending = null; w.onmessage = (e) => { const r = pending; pending = null; r(e.data); };
window.runOcr = (file, engine) => new Promise((res) => { pending = res; w.postMessage({ file, engine }); });
window.ocrReady = true;
</script></body></html>
