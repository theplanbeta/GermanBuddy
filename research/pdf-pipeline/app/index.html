<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hearshot document test page</title>
<style>
 body{font:15px/1.45 system-ui,sans-serif;margin:0;padding:12px 16px;background:#fafafa;color:#222} h1{font-size:18px;margin:0 0 8px}
 #bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center} #status{font-size:13px;color:#555}
 #cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px} @media(max-width:800px){#cols{grid-template-columns:1fr}}
 .page{border-top:2px solid #ccc;margin-top:10px;padding-top:4px;font-size:12px;color:#666} .warn{color:#b00}
 .blk{padding:4px 6px;margin:3px 0;border-left:4px solid #ccc;background:#fff;cursor:pointer;font-size:13px}
 .blk[data-skip="1"]{opacity:.45} .blk.x{text-decoration:line-through;opacity:.3}
 .t-heading{border-color:#1565c0;font-weight:600} .t-paragraph{border-color:#2e7d32} .t-list-item{border-color:#66bb6a}
 .t-footnote,.t-caption,.t-reference{border-color:#f9a825} .t-header-footer,.t-page-number{border-color:#9e9e9e} .t-table,.t-figure-text,.t-equation{border-color:#8e24aa} .t-toc,.t-other{border-color:#bdbdbd}
 .tag{font-size:10px;color:#777;margin-right:6px} #listen{white-space:pre-wrap;background:#fff;padding:8px;font-size:14px}
</style></head>
<body>
<h1>Hearshot: open a document and preview what will be read</h1>
<div id="bar"><input type="file" id="file" accept=".pdf,.epub,.docx,.html,.htm,.md,.txt"><span id="status">No document.</span></div>
<div id="cols"><div><b>Blocks</b> (tap to exclude; grey = skipped by default)<div id="blocks"></div></div><div><b>Will be read</b><div id="listen"></div></div></div>
<script type="module" src="./main.js"></script>
</body></html>
